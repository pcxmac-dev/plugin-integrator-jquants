[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "plugin-integrator-jquants"
version = "0.3.0"  # the plugin's own release (CHANGELOG.md); the app shows it on the Plugins view
description = "J-Quants for Liminal: the Tokyo Stock Exchange's daily bars and listings from JPX's J-Quants API (V2) with an account's API key; the free plan serves two years of history published twelve weeks late."
readme = "README.md"
requires-python = ">=3.10"
# the library it plugs into (the class contract, plugin API 2.0: liminal-libs 1.3.0); which app releases load it is
# the plugin API the plugin declares (PLUGIN.api, checked when the app loads it), not this line
dependencies = ["liminal-libs>=1.49.0"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.entry-points."liminal.providers"]
jquants = "plugin_integrator_jquants"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
